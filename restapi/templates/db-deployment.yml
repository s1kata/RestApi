apiVersion: apps/v1
kind: Deployment
metadata: 
  name: db
  labels:
    app: db
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: db
  template:
    metadata: 
      labels: 
        app: db
      spec:
        containers:
          - name: db
            image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
            ports:
              - containerPort: 5432