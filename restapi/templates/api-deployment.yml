apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: rest-api
          image: "{{ .Values.restApi.image.repository }}:{{ .Values.restApi.image.tag }}"
          ports:
            - containerPort: {{ .Values.restApi.containerPort }}
          env: 
            - name: Database_URL
              value: "postgres://{{ .Values.db.env.POSTGRES_USER }}:{{ .Values.db.env.POSTGRES_PASSWORD }}@db:{{ .Values.db.service.port }}/{{ .Values.db.env.POSTGRES_DB }}?sslmode=disable"