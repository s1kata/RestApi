build:
  rules:
    - when: always
  tags:
   - build
  stage: build
  script:
    - docker build -t ghcr.io/s1kata/rest-api:$CI_COMMIT_SHORT_SHA -t ghcr.io/s1kata/rest-api:latest .
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u s1kata --password-stdin
    - docker push ghcr.io/s1kata/rest-api:$CI_COMMIT_SHORT_SHA
    - docker push ghcr.io/s1kata/rest-api:latest
    - cd restapi
    - helm install restapi .
    
